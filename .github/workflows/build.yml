name: build
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test

  pc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev imagemagick
      - run: make pc
      - name: Prueba automática (sin pantalla) y capturas
        run: |
          SDL_VIDEODRIVER=dummy ./bolitas_pc --smoke
          mogrify -format png shot_*.bmp || true
      - uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: shot_*.png

  psp:
    runs-on: ubuntu-latest
    container: ghcr.io/pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C platform/psp
      - uses: actions/upload-artifact@v4
        with:
          name: EBOOT-PSP
          path: platform/psp/EBOOT.PBP
